plugins {
    id "dev.kikugie.loom-back-compat"
    id "maven-publish"
}

version = "${project.mod_version}+${sc.current.project}"
group = project.maven_group

base {
    archivesName = project.mod_id
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        name "ModMenu"
        url "https://maven.terraformersmc.com/releases/"
    }
    maven {
        name "YACL"
        url "https://maven.isxander.dev/releases"
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.mc_version}"
    loomx.applyMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modCompileOnly "dev.isxander:yet-another-config-lib:${project.yacl_version}"
}

def javaVersion = switch (sc.current.parsed) {
    case { it >= "26.1" } -> JavaVersion.VERSION_25
    case { it >= "1.20.5" } -> JavaVersion.VERSION_21
    case { it >= "1.18" } -> JavaVersion.VERSION_17
    case { it >= "1.17" } -> JavaVersion.VERSION_16
    default -> JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = javaVersion.majorVersion as Integer
}

java {
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    // withSourcesJar()
}

processResources {
    def modProps = [
            "version": project.version,
            "mod_id": project.mod_id,
            "mod_name": project.mod_name,
            "mod_description": project.mod_description,
            "mod_sources": project.mod_sources,
            "mc_version_range": project.mc_version_range,
            "loader_version": project.loader_version
    ]
    def mixinProps = [
            "java_version": javaVersion.majorVersion
    ]
    filteringCharset "UTF-8"
    inputs.properties(modProps)
    inputs.properties(mixinProps)
    filesMatching("fabric.mod.json") {
        expand modProps
    }
    filesMatching("${project.mod_id}.mixins.json") {
        expand mixinProps
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.mod_id}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.mod_id
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
